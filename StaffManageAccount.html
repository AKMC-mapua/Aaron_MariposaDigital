<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Account Information</title>
    <link rel="stylesheet" href="StaffAddLots.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&family=Grenze:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900&family=Jua&family=Noto+Serif+Hentaigana:wght@200..900&display=swap" rel="stylesheet">
</head>
<body> 
    <div class="Main-Container">
        <nav>
            <div class="nav-left-sec">
                <a href="landingPage.html" class="logoA1">
                    <img src="C:\Aaron_MariposaDigital\RESOURCES\RESOURCES\imgFiles\Logo.png" class="Logo" alt="Logo">
                </a>
            </div>
        
            <div class="nav-right-sec">
                <a href="previousPage.html" class="nav-link">Back</a> <!-- Added Back link -->
            </div>
        </nav>

        <section>
            <div class="box-container">
                <div class="large-box">
                    <div class="order-name">Edit Account Information</div>
                    <div class="lot-details">
                        <label for="username">Username:</label>
                        <input type="text" id="username" placeholder="Enter Username">
                        
                        <label for="password">Password:</label>
                        <input type="password" id="password" placeholder="Enter Password">
                        
                        <label for="email">Email:</label>
                        <input type="text" id="email" placeholder="Enter Email">
                        
                        <label for="first-name">First Name:</label>
                        <input type="text" id="first-name" placeholder="Enter First Name">
                        
                        <label for="last-name">Last Name:</label>
                        <input type="text" id="last-name" placeholder="Enter Last Name">
                        
                        <label for="mobile-number">Mobile Number:</label>
                        <input type="text" id="mobile-number" placeholder="Enter Mobile Number">
                        
                        <label for="staff-id">Staff ID:</label>
                        <input type="text" id="staff-id" value="12345" readonly> <!-- Fixed number -->
                    </div>
                    <div class="button-container">
                        <button class="rounded-button">Logout</button>
                        <button class="rounded-button">Save</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
